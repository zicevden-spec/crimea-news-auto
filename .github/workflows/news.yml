name: Crimea News
on:
  schedule:
    - cron: '0,30 3-18 * * *'     # Каждые 30 мин с 06:00 до 21:30 МСК
    - cron: '0,15,30,45 19 * * *' # Каждые 15 мин с 22:00 до 22:45 МСК (чтобы поймать вечер)
    - cron: '0 20 * * *'          # 23:00 МСК (страховка от сильных задержек)
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          TELEGRAM_NEWS_BOT_TOKEN: ${{ secrets.TELEGRAM_NEWS_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
